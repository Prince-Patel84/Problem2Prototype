<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Emblem Neon Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="100" fill="url(#logoBg)" />
  <rect width="512" height="512" rx="100" fill="url(#logoGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="98" stroke="#334155" stroke-width="3" stroke-opacity="0.6" fill="none" />

  <!-- Geometric P2P Emblem -->
  <g filter="url(#logoShadow)">
    
    <!-- Left Node (Problem 'P') -->
    <circle cx="150" cy="180" r="44" fill="#0f172a" stroke="url(#emblemGrad)" stroke-width="8" />
    <text x="150" y="196" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle">P</text>

    <!-- Middle Connector Flow Node ('2' / Lightning) -->
    <path d="M 194 180 L 235 225 L 275 225 L 316 270" stroke="url(#emblemGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="256" cy="225" r="28" fill="#1e1b4b" stroke="#818cf8" stroke-width="6" />
    <text x="256" y="238" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" text-anchor="middle">⚡</text>

    <!-- Right Node (Prototype 'P') -->
    <circle cx="360" cy="270" r="44" fill="#0f172a" stroke="url(#emblemGrad)" stroke-width="8" />
    <text x="360" y="286" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle">P</text>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="390" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" text-anchor="middle" letter-spacing="1">Problem2Prototype</text>
  <text x="256" y="425" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="3">AGILE STUDIO</text>
</svg>
